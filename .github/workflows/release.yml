name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and project versions
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --locked --format-version 1 | node -e "const fs = require('node:fs'); const metadata = JSON.parse(fs.readFileSync(0, 'utf8')); const app = metadata.packages.find((item) => item.name === 'khinfetch'); if (!app) process.exit(1); process.stdout.write(app.version);")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$GITHUB_REF_NAME" != "v$tag_version" || ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the stable semantic version format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          if [[ "$package_version" != "$tauri_version" || "$package_version" != "$cargo_version" ]]; then
            echo "::error::Version mismatch: package.json=$package_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version."
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $package_version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: validate
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rust_target: ""
            args: ""
          - name: Windows x64
            os: windows-latest
            rust_target: ""
            args: ""
          - name: macOS Apple silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KhinFetch v${{ needs.validate.outputs.version }}
          releaseBody: |
            Automated builds for KhinFetch ${{ github.ref_name }}.

            Windows releases include an installer and a portable ZIP archive.
            These packages are not code-signed unless this release explicitly states otherwise.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Create and upload Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = "src-tauri/target/release/khinfetch.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows executable not found at $source"
          }

          $staging = Join-Path $env:RUNNER_TEMP "KhinFetch-portable"
          $archive = Join-Path $env:RUNNER_TEMP "KhinFetch_$($env:RELEASE_VERSION)_windows_x64_portable.zip"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $staging "KhinFetch.exe")
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $staging "LICENSE")
          Set-Content -LiteralPath (Join-Path $staging "khinfetch-portable.txt") -Value "KhinFetch portable distribution marker."
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force

          gh release upload "${{ github.ref_name }}" $archive --clobber

  verify-updater:
    name: Verify updater metadata
    needs: [validate, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify latest.json platform coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/updater"
          releases="$(gh api \
            "repos/${{ github.repository }}/releases?per_page=100")"
          asset_id="$(jq -r --arg tag "${{ github.ref_name }}" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name == "latest.json") | .id' \
            <<<"$releases" | head -n 1)"

          if [[ -z "$asset_id" || "$asset_id" == "null" ]]; then
            echo "::error::Could not find latest.json in the draft release ${{ github.ref_name }}."
            exit 1
          fi

          gh api \
            --header "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$asset_id" \
            > "$RUNNER_TEMP/updater/latest.json"

          node - "$RUNNER_TEMP/updater/latest.json" "${{ needs.validate.outputs.version }}" <<'NODE'
          const fs = require("node:fs");
          const [path, expectedVersion] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(path, "utf8"));
          const required = [
            "linux-x86_64",
            "windows-x86_64",
            "darwin-aarch64",
            "darwin-x86_64",
          ];

          if (metadata.version !== expectedVersion) {
            throw new Error(`latest.json version ${metadata.version} does not match ${expectedVersion}`);
          }

          for (const platform of required) {
            const entry = metadata.platforms?.[platform];
            if (!entry?.url || !entry?.signature) {
              throw new Error(`latest.json is missing a complete ${platform} entry`);
            }
            new URL(entry.url);
          }
          NODE
