name: Sync Release Notes to Updater Metadata

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-notes-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync-latest-json:
    name: Sync latest.json notes
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Update notes in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/updater"
          release_path="$RUNNER_TEMP/updater/release.json"
          latest_path="$RUNNER_TEMP/updater/latest.json"

          if [[ -n "$RELEASE_ID" ]]; then
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$release_path"
          else
            gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$release_path"
          fi

          asset_id="$(jq -r '([.assets[] | select(.name == "latest.json") | .id] | first) // empty' "$release_path")"
          if [[ -z "$asset_id" ]]; then
            echo "No latest.json asset found for release $RELEASE_TAG; skipping."
            exit 0
          fi

          gh api \
            --header "Accept: application/octet-stream" \
            "repos/$GH_REPO/releases/assets/$asset_id" \
            > "$latest_path"

          changed="$(node - "$release_path" "$latest_path" <<'NODE'
          const fs = require("node:fs");
          const [releasePath, latestPath] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          const metadata = JSON.parse(fs.readFileSync(latestPath, "utf8"));
          const nextNotes = (release.body ?? "")
            .replace(/\r\n/g, "\n")
            .trim();

          if (metadata.notes === nextNotes) {
            process.stdout.write("false");
            process.exit(0);
          }

          metadata.notes = nextNotes;
          fs.writeFileSync(latestPath, `${JSON.stringify(metadata, null, 2)}\n`, "utf8");
          process.stdout.write("true");
          NODE
          )"

          if [[ "$changed" != "true" ]]; then
            echo "latest.json notes are already up to date for $RELEASE_TAG."
            exit 0
          fi

          gh release upload "$RELEASE_TAG" "$latest_path" --repo "$GH_REPO" --clobber
          echo "Updated latest.json notes for $RELEASE_TAG."
